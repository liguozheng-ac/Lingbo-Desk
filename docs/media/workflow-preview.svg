<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Watch the Lingbo Desk workflow</title>
  <desc id="desc">A silent edited excerpt of actual execution: sources, pause and revise, then review outputs.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf0f5"/><stop offset="1" stop-color="#f0ecfa"/></linearGradient></defs>
  <rect x="1" y="1" width="1198" height="198" rx="18" fill="url(#bg)" stroke="#e6dbe8"/>
  <circle cx="92" cy="100" r="36" fill="#7d638e"/>
  <path d="M84 84 L108 100 L84 116 Z" fill="#fff8fc"/>
  <text x="155" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" fill="#3e354d">From request to reviewed deliverables.</text>
  <text x="156" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#75657f">ACTUAL EXECUTION · SYNTHETIC INPUTS · EDITED / SILENT</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c466b">
    <rect x="156" y="118" width="184" height="37" rx="10" fill="#ffffff"/>
    <text x="176" y="142">01  Sources</text>
    <text x="359" y="142">→</text>
    <rect x="398" y="118" width="230" height="37" rx="10" fill="#ffffff"/>
    <text x="418" y="142">02  Pause &amp; revise</text>
    <text x="649" y="142">→</text>
    <rect x="688" y="118" width="230" height="37" rx="10" fill="#ffffff"/>
    <text x="708" y="142">03  Review outputs</text>
  </g>
  <text x="1129" y="145" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#8d728e">~1 MIN</text>
</svg>
