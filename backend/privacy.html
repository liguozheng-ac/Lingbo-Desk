<h1>聆泊 · 数据使用说明</h1>
<p>聊天、角色配置、明确保存的记忆、Skills 和任务记录存放在当前用户的本机数据目录。</p>
<p>使用 DeepSeek 时，当前对话与任务所需内容发送给该服务。使用云端识别和合成时，音频或待播报文字发送给用户配置的语音服务。</p>
<p>切换 Ollama 只改变语言模型的处理位置，不会使云端语音自动离线。网页访问和经确认的脚本也会按其功能访问外部服务。</p>
<p>API 凭据使用当前 Windows 用户的加密存储，安装包不包含凭据。当前桌面构建关闭产品使用统计和在线自动更新。</p>
